// ── Road detection ────────────────────────────────────────────────────────────
function pointOnRoad(px, py) {
  for (const road of ROADS) {
    const half = road.w * 0.5;
    const half2 = half * half;
    const pts = road.p;
    for (let i = 0; i < pts.length - 1; i++) {
      const ax = pts[i][0],   ay = pts[i][1];
      const bx = pts[i+1][0], by = pts[i+1][1];
      const dx = bx - ax, dy = by - ay;
      const len2 = dx*dx + dy*dy;
      if (len2 === 0) continue;
      const t = Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / len2));
      const ex = ax + t*dx - px, ey = ay + t*dy - py;
      if (ex*ex + ey*ey < half2) return true;
    }
  }
  return false;
}

// ── Tree generation (seeded, one-time) ────────────────────────────────────────
function lcg(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 0x100000000; };
}
const rng = lcg(31337);

function nearLandmark(x, y) {
  for (const L of LANDMARKS)
    if (Math.abs(x - L.x) < L.w * 0.6 + 24 && Math.abs(y - L.y) < L.h * 0.6 + 24) return true;
  return false;
}

const TREE_COLORS = ['#1b5e20','#2e7d32','#388e3c','#194d09','#145a32','#0a3d0a','#27ae60'];
const TREES = [];
const ATTEMPTS = 1400;
for (let i = 0; i < ATTEMPTS && TREES.length < 520; i++) {
  const x = rng() * WW, y = rng() * WH;
  const r = 7 + rng() * 14;
  if (!nearLandmark(x, y) && !pointOnRoad(x, y)) {
    TREES.push({ x, y, r, c: TREE_COLORS[Math.floor(rng() * TREE_COLORS.length)] });
  }
}

// ── Car state ─────────────────────────────────────────────────────────────────
const car = {
  x: 2500, y: 1453,   // start on main central road
  angle: 0,            // degrees, 0 = north
  speed: 0,            // km/h (+forward / −reverse)
  w: 18, h: 34,
  color: '#e74c3c',
};

// ── Camera ────────────────────────────────────────────────────────────────────
const cam = { x: car.x - VW / 2, y: car.y - VH / 2 };

// ── Input ─────────────────────────────────────────────────────────────────────
const K = {};
addEventListener('keydown', e => { K[e.key] = true;  e.preventDefault(); });
addEventListener('keyup',   e => { K[e.key] = false; });

// ── Physics ───────────────────────────────────────────────────────────────────
const ACCEL        = 72;   // km/h per sec
const BRAKE        = 160;
const FRICTION     = 28;
const OFF_FRIC     = 230;
const MAX_SPEED    = 120;
const TURN_BASE    = 175;  // deg/sec at low speed
const PX_PER_KMH  = 1.12;  // pixels / (km/h · sec)

let lastT = 0;
function update(dt) {
  const road = pointOnRoad(car.x, car.y);
  const maxSpd = road ? MAX_SPEED : 20;

  if (K['ArrowUp']    || K['w'] || K['W'])
    car.speed = Math.min(maxSpd,  car.speed + ACCEL * dt);
  else if (K['ArrowDown'] || K['s'] || K['S'])
    car.speed = Math.max(-maxSpd * 0.4, car.speed - BRAKE * dt);
  else {
    const fr = road ? FRICTION : OFF_FRIC;
    if      (car.speed >  0.5) car.speed -= fr * dt;
    else if (car.speed < -0.5) car.speed += fr * dt;
    else                       car.speed  = 0;
  }
  car.speed = Math.max(-maxSpd * 0.4, Math.min(maxSpd, car.speed));

  const spd  = Math.abs(car.speed);
  const tMul = Math.max(0.22, 1 - spd / (MAX_SPEED * 1.6));
  const dir  = Math.sign(car.speed) || 1;
  if (K['ArrowLeft']  || K['a'] || K['A']) car.angle -= TURN_BASE * tMul * dt * dir;
  if (K['ArrowRight'] || K['d'] || K['D']) car.angle += TURN_BASE * tMul * dt * dir;

  const rad = car.angle * Math.PI / 180;
  const px  = car.speed * PX_PER_KMH;
  car.x = Math.max(10, Math.min(WW - 10, car.x + Math.sin(rad) * px * dt));
  car.y = Math.max(10, Math.min(WH - 10, car.y - Math.cos(rad) * px * dt));

  cam.x += (car.x - VW / 2 - cam.x) * 0.13;
  cam.y += (car.y - VH / 2 - cam.y) * 0.13;
  cam.x  = Math.max(0, Math.min(WW - VW, cam.x));
  cam.y  = Math.max(0, Math.min(WH - VH, cam.y));
}

// ── Rendering helpers ─────────────────────────────────────────────────────────
function roadPath(pts) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
}

function drawWorld() {
  // Terrain base
  ctx.fillStyle = '#263a14';
  ctx.fillRect(0, 0, WW, WH);

  // Urban blocks (lighter centre)
  ctx.fillStyle = '#2f4318';
  ctx.fillRect(300, 600, 4600, 2800);
  ctx.fillStyle = '#354c1a';
  ctx.fillRect(600, 800, 4000, 2300);

  // ── Roads ───────────────────────────────────────────────────────────────
  for (const r of ROADS) {
    // Kerb / shadow
    ctx.beginPath(); roadPath(r.p);
    ctx.strokeStyle = '#111';
    ctx.lineWidth   = r.w + 7;
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.stroke();
    // Asphalt
    ctx.beginPath(); roadPath(r.p);
    ctx.strokeStyle = '#484848';
    ctx.lineWidth   = r.w;
    ctx.stroke();
    // Road surface lighter centre
    ctx.beginPath(); roadPath(r.p);
    ctx.strokeStyle = '#555';
    ctx.lineWidth   = r.w - 5;
    ctx.stroke();
    // Dashed centre line
    ctx.beginPath(); roadPath(r.p);
    ctx.strokeStyle = 'rgba(255,210,0,0.55)';
    ctx.lineWidth   = 1.8;
    ctx.setLineDash([20, 20]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── Trees ────────────────────────────────────────────────────────────────
  for (const t of TREES) {
    const sx = t.x - cam.x, sy = t.y - cam.y;
    if (sx < -t.r * 2 || sx > VW + t.r * 2 || sy < -t.r * 2 || sy > VH + t.r * 2) continue;
    ctx.beginPath(); ctx.arc(t.x + 3, t.y + 4, t.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
    ctx.fillStyle = t.c; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x - t.r*.3, t.y - t.r*.3, t.r*.38, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();
  }

  // ── Buildings / landmarks ────────────────────────────────────────────────
  for (const b of LANDMARKS) {
    const bx = b.x - b.w * .5, by = b.y - b.h * .5;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(bx + 5, by + 5, b.w, b.h);
    ctx.fillStyle = b.c;
    ctx.fillRect(bx, by, b.w, b.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1; ctx.strokeRect(bx, by, b.w, b.h);

    ctx.fillStyle = b.tc;
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const words = b.n.split(' ');
    if (words.length >= 2 && b.w < 130) {
      const mid = Math.ceil(words.length / 2);
      ctx.fillText(words.slice(0, mid).join(' '), b.x, b.y - 7);
      ctx.fillText(words.slice(mid).join(' '),    b.x, b.y + 7);
    } else {
      ctx.fillText(b.n, b.x, b.y);
    }
  }

  // ── Car ──────────────────────────────────────────────────────────────────
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle * Math.PI / 180);
  const cw = car.w, ch = car.h;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.fillRect(-cw/2 + 4, -ch/2 + 5, cw, ch);
  // Body
  ctx.fillStyle = car.color;
  ctx.fillRect(-cw/2, -ch/2, cw, ch);
  // Windshield
  ctx.fillStyle = '#aed6f1';
  ctx.fillRect(-cw/2 + 2, -ch/2 + 4, cw - 4, 9);
  // Rear window
  ctx.fillStyle = '#5d8aa8';
  ctx.fillRect(-cw/2 + 2, ch/2 - 10, cw - 4, 7);
  // Headlights
  ctx.fillStyle = '#fef9e7';
  ctx.fillRect(-cw/2,     -ch/2,     5, 3);
  ctx.fillRect(cw/2 - 5,  -ch/2,     5, 3);
  // Tail lights
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(-cw/2,     ch/2 - 3,  5, 3);
  ctx.fillRect(cw/2 - 5,  ch/2 - 3,  5, 3);

  ctx.restore();
}

// ── Speedometer ───────────────────────────────────────────────────────────────
function drawSpeedometer() {
  const kmh = Math.abs(Math.round(car.speed));
  const cx = VW - 80, cy = VH - 80, r = 54;

  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.82)'; ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();

  const aStart = -Math.PI * 0.78, aEnd = Math.PI * 0.78;
  // Background arc
  ctx.beginPath(); ctx.arc(cx, cy, r - 9, aStart, aEnd);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
  // Speed arc
  const pct = Math.min(kmh / MAX_SPEED, 1);
  if (pct > 0) {
    ctx.beginPath(); ctx.arc(cx, cy, r - 9, aStart, aStart + (aEnd - aStart) * pct);
    ctx.strokeStyle = pct < 0.5 ? '#00e676' : pct < 0.8 ? '#ffca28' : '#ff5252';
    ctx.lineWidth = 6; ctx.stroke();
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 25px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(kmh, cx, cy - 4);
  ctx.fillStyle = '#999';
  ctx.font = '10px monospace'; ctx.fillText('KM/H', cx, cy + 17);
  if (car.speed < -1) {
    ctx.fillStyle = '#ff5252'; ctx.font = 'bold 10px monospace'; ctx.fillText('REV', cx, cy + 29);
  }
}

// ── Mini-map ──────────────────────────────────────────────────────────────────
function drawMinimap() {
  const mmW = 148, mmH = 108;
  const mmX = VW - mmW - 10, mmY = 10;
  const sx = mmW / WW, sy = mmH / WH;

  ctx.save(); ctx.translate(mmX, mmY);
  ctx.fillStyle = 'rgba(0,0,0,0.78)'; ctx.fillRect(0, 0, mmW, mmH);
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.strokeRect(0, 0, mmW, mmH);

  // Roads
  for (const r of ROADS) {
    ctx.beginPath();
    ctx.moveTo(r.p[0][0] * sx, r.p[0][1] * sy);
    for (let i = 1; i < r.p.length; i++) ctx.lineTo(r.p[i][0] * sx, r.p[i][1] * sy);
    ctx.strokeStyle = '#686868'; ctx.lineWidth = 1; ctx.lineCap = 'round'; ctx.stroke();
  }
  // Landmark dots
  for (const b of LANDMARKS) {
    ctx.fillStyle = b.c;
    ctx.fillRect(b.x * sx - 1.5, b.y * sy - 1.5, 3, 3);
  }
  // Viewport rect
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 0.5;
  ctx.strokeRect(cam.x * sx, cam.y * sy, VW * sx, VH * sy);
  // Car dot
  ctx.beginPath(); ctx.arc(car.x * sx, car.y * sy, 2.5, 0, Math.PI*2);
  ctx.fillStyle = '#e74c3c'; ctx.fill();

  ctx.restore();
}

// ── Off-road warning ──────────────────────────────────────────────────────────
let offRoadWarnAlpha = 0;
function drawWarnings(road) {
  if (!road) offRoadWarnAlpha = Math.min(1, offRoadWarnAlpha + 0.08);
  else       offRoadWarnAlpha = Math.max(0, offRoadWarnAlpha - 0.05);
  if (offRoadWarnAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,120,0,${offRoadWarnAlpha * 0.9})`;
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('⚠  OFF ROAD', VW / 2, 44);
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  update(dt);

  ctx.clearRect(0, 0, VW, VH);
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  drawWorld();
  ctx.restore();

  drawMinimap();
  drawSpeedometer();
  drawWarnings(pointOnRoad(car.x, car.y));

  requestAnimationFrame(loop);
}

requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
