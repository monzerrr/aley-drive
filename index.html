<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101310" />
    <title>Aley Drive — Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">ALEY DRIVE / 2D PROTOTYPE</p>
        <h1>Aley: First Shift</h1>
        <p class="subhead">Piscine Street + Aley Center · real local road geometry · no engine needed</p>
      </header>
      <section class="game-frame" aria-label="Aley driving prototype">
        <canvas id="world" width="1280" height="800" aria-label="Drawn top-down map of the Aley prototype zone"></canvas>
        <div class="hud" aria-live="polite"><span id="speed">0 km/h</span><span id="mission">Delivery 1/3</span><span id="location">Piscine Street</span></div>
        <div class="controls"><b>Drive:</b> W A S D or arrow keys · <b>R:</b> reset car · reach the blue delivery marker</div>
      </section>
    </main>
    <script src="roads.js"></script><script src="game.js"></script>
  </body>
</html>
